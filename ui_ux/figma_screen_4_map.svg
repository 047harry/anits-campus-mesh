<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="390" height="844" rx="40" fill="#000000"/>
        <rect width="390" height="844" rx="40" stroke="#374151" stroke-width="2"/>

        
        <!-- Status Bar -->
        <g id="StatusBar">
            <text x="32" y="32" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700">9:41</text>
            <!-- Dynamic Island / Speaker Notch -->
            <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000"/>
            <circle cx="230" cy="28" r="5" fill="#1E293B"/>
            <circle cx="160" cy="28" r="4" fill="#0F172A"/>
            <!-- Radio & Battery icons -->
            <circle cx="310" cy="28" r="4" fill="#10B981"/>
            <text x="320" y="32" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600">14p</text>
            <rect x="345" y="22" width="22" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
            <rect x="347" y="24" width="14" height="8" rx="1.5" fill="#10B981"/>
            <rect x="368" y="26" width="2" height="4" rx="1" fill="#FFFFFF"/>
        </g>
        <!-- Blackout Banner -->
        <g id="BlackoutBanner">
            <rect x="16" y="52" width="358" height="28" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
            <circle cx="30" cy="66" r="4" fill="#EF4444"/>
            <text x="42" y="70" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">OFFLINE MESH ACTIVE • CELLULAR &amp; GRID DOWN</text>
        </g>
        

        <!-- Header -->
        <g id="MapHeader">
            <text x="20" y="112" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="20" font-weight="800">OFFLINE MUSTER MAP</text>
            <text x="20" y="130" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600">ANITS CAMPUS VECTOR NAVIGATION</text>
        </g>

        <!-- Map Canvas Area -->
        <g id="VectorMap">
            <!-- Map Container -->
            <rect x="16" y="146" width="358" height="420" rx="16" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>

            <!-- Grid Lines -->
            <line x1="16" y1="250" x2="374" y2="250" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
            <line x1="16" y1="360" x2="374" y2="360" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
            <line x1="195" y1="146" x2="195" y2="566" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

            <!-- CSE Block (Top Left) -->
            <rect x="36" y="166" width="130" height="74" rx="8" fill="#1F2937" stroke="#EF4444" stroke-width="2"/>
            <text x="101" y="196" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CSE BLOCK</text>
            <rect x="56" y="206" width="90" height="20" rx="4" fill="#EF4444"/>
            <text x="101" y="220" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">YOU ARE HERE (FL 3)</text>

            <!-- ECE Block (Top Right) -->
            <rect x="224" y="166" width="130" height="74" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
            <text x="289" y="200" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ECE BLOCK</text>
            <text x="289" y="218" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Status: Cleared</text>

            <!-- Central Cricket Ground (Safe Zone) -->
            <rect x="56" y="280" width="278" height="120" rx="14" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-width="2"/>
            <circle cx="195" cy="320" r="16" fill="#10B981"/>
            <text x="195" y="325" fill="#000000" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">★</text>
            <text x="195" y="352" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">CENTRAL CRICKET GROUND</text>
            <text x="195" y="370" fill="#A7F3D0" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DESIGNATED SAFE MUSTER POINT</text>
            <rect x="115" y="376" width="160" height="18" rx="4" fill="#047857"/>
            <text x="195" y="388" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MEDICAL TRIAGE TENT 1 ACTIVE</text>

            <!-- Mechanical Block (Bottom Left) -->
            <rect x="36" y="440" width="130" height="74" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
            <text x="101" y="474" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MECH BLOCK</text>
            <text x="101" y="492" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Exit to South Yard</text>

            <!-- Admin Block (Bottom Right) -->
            <rect x="224" y="440" width="130" height="74" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
            <text x="289" y="474" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ADMIN BLOCK</text>
            <text x="289" y="492" fill="#F59E0B" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Emergency Supplies</text>

            <!-- Evacuation Pathway Arrows (Green dashed) -->
            <path d="M 101 240 L 101 280" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
            <path d="M 289 240 L 289 280" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>
            <path d="M 101 440 L 101 400" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>
            <path d="M 289 440 L 289 400" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>
        </g>

        <!-- Evacuation Route Instruction Card -->
        <g id="RouteCard">
            <rect x="16" y="580" width="358" height="76" rx="12" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
            <text x="32" y="604" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="800">RECOMMENDED EVACUATION ROUTE:</text>
            <text x="32" y="622" fill="#E5E7EB" font-family="Inter, Roboto, sans-serif" font-size="11">Take North Stairwell down to Ground Floor.</text>
            <text x="32" y="640" fill="#E5E7EB" font-family="Inter, Roboto, sans-serif" font-size="11">Follow green markers 90m East into Cricket Ground.</text>
        </g>

        
        <!-- Bottom Navigation Bar -->
        <g id="BottomNavBar">
            <rect x="0" y="764" width="390" height="80" fill="#000000" fill-opacity="0.95"/>
            <line x1="0" y1="764" x2="390" y2="764" stroke="#1F2937" stroke-width="1"/>
            
            <g id="Tab_sos">
                <circle cx="48" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="48" cy="788" r="6" fill="#64748B"/>
                <text x="48" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">SOS</text>
                
            </g>
            
            <g id="Tab_bulletins">
                <circle cx="146" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="146" cy="788" r="6" fill="#64748B"/>
                <text x="146" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Bulletins</text>
                
            </g>
            
            <g id="Tab_chat">
                <circle cx="244" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="244" cy="788" r="6" fill="#64748B"/>
                <text x="244" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Mesh Chat</text>
                
            </g>
            
            <g id="Tab_map">
                <circle cx="342" cy="788" r="14" fill="#10B981" fill-opacity="0.2"/>
                <circle cx="342" cy="788" r="6" fill="#10B981"/>
                <text x="342" y="812" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Campus Map</text>
                <circle cx="342" cy="824" r="2.5" fill="#10B981"/>
            </g>
            
            <!-- Home Indicator -->
            <rect x="125" y="834" width="140" height="4" rx="2" fill="#4B5563"/>
        </g>
        
    </svg>