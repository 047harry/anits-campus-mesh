<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="390" height="844" rx="40" fill="#000000"/>
        <rect width="390" height="844" rx="40" stroke="#374151" stroke-width="2"/>

        
        <!-- Status Bar -->
        <g id="StatusBar">
            <text x="32" y="32" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700">9:41</text>
            <!-- Dynamic Island / Speaker Notch -->
            <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000"/>
            <circle cx="230" cy="28" r="5" fill="#1E293B"/>
            <circle cx="160" cy="28" r="4" fill="#0F172A"/>
            <!-- Radio & Battery icons -->
            <circle cx="310" cy="28" r="4" fill="#10B981"/>
            <text x="320" y="32" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600">14p</text>
            <rect x="345" y="22" width="22" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
            <rect x="347" y="24" width="14" height="8" rx="1.5" fill="#10B981"/>
            <rect x="368" y="26" width="2" height="4" rx="1" fill="#FFFFFF"/>
        </g>
        <!-- Blackout Banner -->
        <g id="BlackoutBanner">
            <rect x="16" y="52" width="358" height="28" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
            <circle cx="30" cy="66" r="4" fill="#EF4444"/>
            <text x="42" y="70" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">OFFLINE MESH ACTIVE • CELLULAR &amp; GRID DOWN</text>
        </g>
        

        <!-- Chat Peer Header -->
        <g id="ChatHeader">
            <rect x="16" y="90" width="358" height="60" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
            <circle cx="44" cy="120" r="18" fill="#1E293B"/>
            <text x="44" y="125" fill="#3B82F6" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">RS</text>
            <text x="70" y="114" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700">Rahul Sharma (A23126551124)</text>
            <text x="70" y="132" fill="#3B82F6" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600">🔒 End-to-End Encrypted • 1 Hop (BLE/Wi-Fi)</text>
        </g>

        <!-- Message History -->
        <!-- Incoming 1 -->
        <g id="Msg1_Incoming">
            <rect x="16" y="168" width="280" height="74" rx="14" fill="#1E293B" stroke="#374151" stroke-width="1"/>
            <text x="30" y="190" fill="#93C5FD" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">Rahul (CSE Block Stairwell)</text>
            <text x="30" y="210" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">Are you stuck on Floor 3? The northern</text>
            <text x="30" y="228" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">fire stairwell is clear of rubble.</text>
            <text x="248" y="234" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="9">10:18</text>
        </g>

        <!-- Outgoing 1 -->
        <g id="Msg2_Outgoing">
            <rect x="94" y="254" width="280" height="78" rx="14" fill="#1D4ED8"/>
            <text x="108" y="276" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">Yes, 3 of us here in Lab 4. One</text>
            <text x="108" y="294" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">student has sprained ankle. Moving</text>
            <text x="108" y="312" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">towards the north landing now!</text>
            <text x="314" y="324" fill="#93C5FD" font-family="Inter, Roboto, sans-serif" font-size="9">10:19 • &gt;&gt; Relayed</text>
        </g>

        <!-- Incoming 2 -->
        <g id="Msg3_Incoming">
            <rect x="16" y="344" width="280" height="60" rx="14" fill="#1E293B" stroke="#374151" stroke-width="1"/>
            <text x="30" y="366" fill="#93C5FD" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">Rahul</text>
            <text x="30" y="386" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">Standing by Floor 2 door with splint.</text>
            <text x="248" y="396" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="9">10:20</text>
        </g>

        <!-- Outgoing 2 (Delivered ACK) -->
        <g id="Msg4_Outgoing">
            <rect x="134" y="416" width="240" height="60" rx="14" fill="#1D4ED8"/>
            <text x="148" y="438" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">Reached Floor 2 landing.</text>
            <text x="148" y="456" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12">We see you!</text>
            <text x="282" y="468" fill="#86EFAC" font-family="Inter, Roboto, sans-serif" font-size="9">10:21 • ✓✓ Delivered</text>
        </g>

        <!-- Input Bar -->
        <g id="MessageInputBar">
            <rect x="16" y="700" width="358" height="52" rx="26" fill="#111827" stroke="#374151" stroke-width="1.5"/>
            <text x="36" y="732" fill="#6B7280" font-family="Inter, Roboto, sans-serif" font-size="13">Type offline mesh message...</text>
            <circle cx="344" cy="726" r="18" fill="#3B82F6"/>
            <text x="344" y="731" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">➔</text>
        </g>

        
        <!-- Bottom Navigation Bar -->
        <g id="BottomNavBar">
            <rect x="0" y="764" width="390" height="80" fill="#000000" fill-opacity="0.95"/>
            <line x1="0" y1="764" x2="390" y2="764" stroke="#1F2937" stroke-width="1"/>
            
            <g id="Tab_sos">
                <circle cx="48" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="48" cy="788" r="6" fill="#64748B"/>
                <text x="48" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">SOS</text>
                
            </g>
            
            <g id="Tab_bulletins">
                <circle cx="146" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="146" cy="788" r="6" fill="#64748B"/>
                <text x="146" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Bulletins</text>
                
            </g>
            
            <g id="Tab_chat">
                <circle cx="244" cy="788" r="14" fill="#3B82F6" fill-opacity="0.2"/>
                <circle cx="244" cy="788" r="6" fill="#3B82F6"/>
                <text x="244" y="812" fill="#3B82F6" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Mesh Chat</text>
                <circle cx="244" cy="824" r="2.5" fill="#3B82F6"/>
            </g>
            
            <g id="Tab_map">
                <circle cx="342" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="342" cy="788" r="6" fill="#64748B"/>
                <text x="342" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Campus Map</text>
                
            </g>
            
            <!-- Home Indicator -->
            <rect x="125" y="834" width="140" height="4" rx="2" fill="#4B5563"/>
        </g>
        
    </svg>