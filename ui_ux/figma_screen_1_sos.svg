<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="sosGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="sosBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#EF4444"/>
                <stop offset="100%" stop-color="#991B1B"/>
            </linearGradient>
        </defs>
        <!-- Background -->
        <rect width="390" height="844" rx="40" fill="#000000"/>
        <rect width="390" height="844" rx="40" stroke="#374151" stroke-width="2"/>

        
        <!-- Status Bar -->
        <g id="StatusBar">
            <text x="32" y="32" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700">9:41</text>
            <!-- Dynamic Island / Speaker Notch -->
            <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000"/>
            <circle cx="230" cy="28" r="5" fill="#1E293B"/>
            <circle cx="160" cy="28" r="4" fill="#0F172A"/>
            <!-- Radio & Battery icons -->
            <circle cx="310" cy="28" r="4" fill="#10B981"/>
            <text x="320" y="32" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600">14p</text>
            <rect x="345" y="22" width="22" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
            <rect x="347" y="24" width="14" height="8" rx="1.5" fill="#10B981"/>
            <rect x="368" y="26" width="2" height="4" rx="1" fill="#FFFFFF"/>
        </g>
        <!-- Blackout Banner -->
        <g id="BlackoutBanner">
            <rect x="16" y="52" width="358" height="28" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
            <circle cx="30" cy="66" r="4" fill="#EF4444"/>
            <text x="42" y="70" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">OFFLINE MESH ACTIVE • CELLULAR &amp; GRID DOWN</text>
        </g>
        

        <!-- Location Header Card -->
        <g id="LocationCard">
            <rect x="16" y="92" width="358" height="56" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
            <circle cx="36" cy="120" r="10" fill="#1F2937"/>
            <text x="36" y="124" fill="#EF4444" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📍</text>
            <text x="56" y="112" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600">AUTO-DETECTED CAMPUS LOCATION</text>
            <text x="56" y="132" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700">CSE Block — Floor 3 (Corridor A)</text>
            <rect x="290" y="106" width="72" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
            <text x="326" y="123" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">GPS/BLE OK</text>
        </g>

        <!-- SOS Central Trigger Area -->
        <g id="SosTriggerArea">
            <!-- Pulsing outer glow -->
            <circle cx="195" cy="290" r="130" fill="url(#sosGlow)"/>
            <circle cx="195" cy="290" r="105" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
            <!-- Core Interactive SOS Button -->
            <circle cx="195" cy="290" r="82" fill="url(#sosBtnGrad)" stroke="#FFFFFF" stroke-width="3.5"/>
            <text x="195" y="278" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1.5">EMERGENCY</text>
            <text x="195" y="310" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">SOS</text>
            <rect x="135" y="326" width="120" height="20" rx="10" fill="#000000" fill-opacity="0.4"/>
            <text x="195" y="340" fill="#FEE2E2" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HOLD 1.5s OR TAP</text>
        </g>

        <!-- Quick Triage Category Tags -->
        <g id="TriageCategories">
            <text x="20" y="446" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">SPECIFY HAZARD (AUTO-INCLUDED IN SOS):</text>
            <!-- Tag 1 -->
            <rect x="16" y="458" width="172" height="42" rx="8" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
            <text x="30" y="484" fill="#FFFFFF" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700">🚨 Medical / Injury</text>
            <!-- Tag 2 -->
            <rect x="202" y="458" width="172" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
            <text x="216" y="484" fill="#D1D5DB" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600">🏚️ Trapped in Room</text>
            <!-- Tag 3 -->
            <rect x="16" y="510" width="172" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
            <text x="30" y="536" fill="#D1D5DB" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600">🔥 Smoke / Fire Hazard</text>
            <!-- Tag 4 -->
            <rect x="202" y="510" width="172" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
            <text x="216" y="536" fill="#D1D5DB" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600">⚡ Electrical Blackout</text>
        </g>

        <!-- Relay Notice Card -->
        <g id="RelayNotice">
            <rect x="16" y="572" width="358" height="74" rx="10" fill="#111827" stroke="#10B981" stroke-width="1"/>
            <circle cx="36" cy="600" r="10" fill="#064E3B"/>
            <text x="36" y="604" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
            <text x="56" y="596" fill="#10B981" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="700">CLOSED-LOOP CONFIRMATION READY</text>
            <text x="56" y="614" fill="#D1D5DB" font-family="Inter, Roboto, sans-serif" font-size="11">Signal bounces across campus to Health Center.</text>
            <text x="56" y="630" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10">Screen turns GREEN immediately upon doctor acknowledgment.</text>
        </g>

        
        <!-- Bottom Navigation Bar -->
        <g id="BottomNavBar">
            <rect x="0" y="764" width="390" height="80" fill="#000000" fill-opacity="0.95"/>
            <line x1="0" y1="764" x2="390" y2="764" stroke="#1F2937" stroke-width="1"/>
            
            <g id="Tab_sos">
                <circle cx="48" cy="788" r="14" fill="#EF4444" fill-opacity="0.2"/>
                <circle cx="48" cy="788" r="6" fill="#EF4444"/>
                <text x="48" y="812" fill="#EF4444" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SOS</text>
                <circle cx="48" cy="824" r="2.5" fill="#EF4444"/>
            </g>
            
            <g id="Tab_bulletins">
                <circle cx="146" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="146" cy="788" r="6" fill="#64748B"/>
                <text x="146" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Bulletins</text>
                
            </g>
            
            <g id="Tab_chat">
                <circle cx="244" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="244" cy="788" r="6" fill="#64748B"/>
                <text x="244" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Mesh Chat</text>
                
            </g>
            
            <g id="Tab_map">
                <circle cx="342" cy="788" r="14" fill="#1E293B" fill-opacity="0.4"/>
                <circle cx="342" cy="788" r="6" fill="#64748B"/>
                <text x="342" y="812" fill="#9CA3AF" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Campus Map</text>
                
            </g>
            
            <!-- Home Indicator -->
            <rect x="125" y="834" width="140" height="4" rx="2" fill="#4B5563"/>
        </g>
        
    </svg>